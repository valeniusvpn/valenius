name: valenius_mobile
description: Valenius mobile VPN client (Android-first, iOS-ready).
publish_to: "none"
version: 0.0.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1   # state management (documented choice)
  http: ^1.2.2               # backend client
  valenius_vpn:              # native WireGuard tunnel plugin (the platform seam)
    path: packages/valenius_vpn
  flutter_secure_storage: ^9.2.2   # ClientKey (and later, config keys) at rest
  device_info_plus: ^10.1.2        # device name reported to the backend as Hostname
  mobile_scanner: ^7.0.0           # QR pairing scan (7.x MLKit uses GoogleDataTransport ~>10, aligning with Firebase's on iOS)
  url_launcher: ^6.3.0             # open MFA authorize / enrollment links
  package_info_plus: ^8.0.0        # app version for the About dialog
  firebase_core: ^3.6.0            # Firebase init (FCM, Pro push-to-approve)
  firebase_messaging: ^15.1.3      # FCM push token + messages
  local_auth: ^2.3.0               # biometric gate for push-to-approve
  connectivity_plus: ^6.0.5        # OS network-change events → re-verify the tunnel

  # --- planned, wired in later milestones (kept out until used to keep analyze clean) ---
  # flutter_secure_storage: ^9.2.2   # encrypted config + ClientKey at rest (Keystore/Keychain)
  # local_auth: ^2.3.0               # biometric gate for MFA approve
  # mobile_scanner: ^5.2.3           # QR pairing scan
  # qr_flutter: ^4.1.0               # TOTP enrolment QR display
  # app_links: ^6.3.2                # MfaAuthorizeUrl / pairing deep links
  # firebase_messaging: ^15.1.3      # FCM push (behind the PushProvider seam)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/valenius.png
    - assets/logo/valenius_full.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/valenius.png"
  remove_alpha_ios: true                # iOS icons must be opaque (no alpha)
  background_color_ios: "#162030"       # flatten transparency onto Valenius dark
  min_sdk_android: 24
  adaptive_icon_background: "#162030"   # Valenius dark
  adaptive_icon_foreground: "assets/icon/valenius.png"
