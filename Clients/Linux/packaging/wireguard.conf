# Load the WireGuard kernel module at boot (systemd-modules-load).
# The valenius daemon runs hardened (CapabilityBoundingSet=CAP_NET_ADMIN
# CAP_NET_RAW, NoNewPrivileges=true), so it cannot autoload the module itself
# when `wg-quick` creates the first interface -- the kernel denies the implicit
# load with EPERM ("Operation not permitted"). Loading it independently here
# means CAP_NET_ADMIN is all the daemon needs to create wireguard interfaces.
wireguard
