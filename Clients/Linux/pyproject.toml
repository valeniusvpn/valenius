[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "valenius-linux"
version = "1.0.0"
description = "Linux client for Valenius VPN manager"
requires-python = ">=3.10"
# Runtime deps are system packages installed via apt (see packaging/debian/control)
# No PyPI dependencies needed.
dependencies = []

[project.scripts]
valenius-daemon = "daemon.__main__:main"
valenius-tray   = "tray.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "daemon*", "tray*"]
