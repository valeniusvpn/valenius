# nginx server block for the static Valenius help site (help.valenius.com).
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # MkDocs uses clean directory URLs (use_directory_urls: true), so /foo/
    # resolves to /foo/index.html. Fall through to the generated 404 page.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Long-cache fingerprinted theme assets; HTML stays uncached so content
    # updates are picked up immediately after a redeploy.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Defence-in-depth headers for a browser-facing site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
