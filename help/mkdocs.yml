site_name: Valenius Help
site_url: https://help.valenius.com/
site_description: >-
  Step-by-step installation guides and day-to-day usage help for Valenius —
  the WireGuard® VPN management platform.
site_author: Valenius / Stranto
copyright: Copyright &copy; Stranto. WireGuard is a registered trademark of Jason A. Donenfeld.

use_directory_urls: true

# English only at launch. German (and possibly Slovak) will be added via
# mkdocs-static-i18n once the content is stable — see docs/help.md (concept)
# in the main repo. Keep page files translation-ready: one page per topic,
# no language-specific structure.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  # Valenius brand blue (same #0F4E66 / #1DABDA used in the admin panel,
  # see Backend/.../Pages/Shared/_Layout.cshtml) via a custom Material palette
  # — the built-in named schemes don't include this exact color.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Install:
      - install/index.md
      - Prerequisites: install/prerequisites.md
      - Backend — Community edition: install/backend-community.md
      - Backend — Pro edition: install/backend-pro.md
      - Integrated WireGuard server (Pro): install/integrated-server.md
      - Windows client: install/client-windows.md
      - Linux client: install/client-linux.md
      - macOS client: install/client-macos.md
      - Mobile app: install/client-mobile.md
      - Home Assistant add-on: install/client-homeassistant.md
      - First steps after install: install/first-steps.md
  - Working with Valenius:
      - working/index.md
      - Overview dashboard: working/overview-dashboard.md
      - Clients: working/clients.md
      - Customers: working/customers.md
      - Users & sign-in: working/users-sign-in.md
      - Releases & auto-update: working/releases-updates.md
      - Settings: working/settings.md
      - MFA session gating: working/mfa.md
      - Traffic dashboard: working/traffic.md
      - Testing a server (Pro): working/server-testing.md
      - Audit log: working/audit-log.md
      - Device pairing (QR): working/device-pairing.md
      - API tokens (Pro): working/api-tokens.md
      - Connect an AI assistant or automation tool (Pro): working/ai-integrations.md
      - Monitoring (Zabbix, Prometheus): working/monitoring.md
      - Diagnostic logs: working/diagnostics.md
      - For users: working/for-users.md
