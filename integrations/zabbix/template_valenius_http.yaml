zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b4974d2094f54da09da2addf038110db
      name: Templates/Applications
  templates:
    - uuid: 748816ccb65d4527966c7e750bb4083c
      template: 'Valenius by HTTP'
      name: 'Valenius by HTTP'
      description: |
        Monitors a Valenius VPN backend via its Prometheus-compatible /api/v1/metrics
        endpoint. One HTTP agent item per minute regardless of fleet size; everything
        else is a dependent item or LLD-discovered prototype parsed from that one
        payload via Zabbix's built-in Prometheus preprocessing.

        Requires a monitoring:read token, minted from the backend's Admin -> Monitoring
        page. See https://documentation.valenius.com/monitoring/ and
        https://documentation.valenius.com/integrations/zabbix/.

        Per-gateway items/triggers (Pro only, need an integrated WireGuard server) are
        discovered automatically; on Community-only or External-only fleets the
        discovery rule simply finds nothing.
      groups:
        - name: Templates/Applications
      items:
        - uuid: ebc36b0f6f7e4420b8ec6162db2040cf
          name: 'Get metrics'
          type: HTTP_AGENT
          key: valenius.get.metrics
          history: 7d
          trends: '0'
          value_type: TEXT
          units: ''
          url: '{$VALENIUS.URL}/api/v1/metrics'
          headers:
            - name: Authorization
              value: 'Bearer {$VALENIUS.TOKEN}'
          timeout: '{$VALENIUS.HTTP.TIMEOUT}'
          delay: 1m
          description: 'Master item. Raw Prometheus text exposition — everything else is a dependent item parsed out of this.'
          tags:
            - tag: component
              value: control-plane

        - uuid: abb43c7e191d4828bb5d7ac76e07d9a9
          name: 'Control plane is responding'
          type: DEPENDENT
          key: valenius.up
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_up
                - value
                - ''
          valuemap:
            name: 'Boolean'
          tags:
            - tag: component
              value: control-plane
            - tag: scope
              value: availability

        - uuid: 9cf1454c419f478f888799200c73f515
          name: 'Backend version'
          type: DEPENDENT
          key: valenius.build.version
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'valenius_build_info'
                - label
                - version
          tags:
            - tag: component
              value: control-plane

        - uuid: c89634619c874180a1c2e44f738be538
          name: 'Backend edition'
          type: DEPENDENT
          key: valenius.build.edition
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'valenius_build_info'
                - label
                - edition
          tags:
            - tag: component
              value: control-plane

        - uuid: 3c12ea7febce47adb97878c42da68fdf
          name: 'Process start time'
          type: DEPENDENT
          key: valenius.start.timestamp
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          units: unixtime
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_start_timestamp_seconds
                - value
                - ''
          tags:
            - tag: component
              value: control-plane

        - uuid: a1acd172ebf64ccb9ee64e5507309478
          name: 'Metrics snapshot generated at'
          type: DEPENDENT
          key: valenius.stats.generated.timestamp
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          units: unixtime
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_stats_generated_timestamp_seconds
                - value
                - ''
          tags:
            - tag: component
              value: control-plane

        - uuid: eaa2394b636d4524ab02b0932080be42
          name: 'Metrics snapshot age'
          type: DEPENDENT
          key: valenius.stats.age
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_stats_generated_timestamp_seconds
                - value
                - ''
            - type: JAVASCRIPT
              parameters:
                - 'return Math.round(Date.now()/1000 - value);'
          description: 'How stale the 15s server-side snapshot cache is. High values mean the control plane itself is having trouble, not that any one gateway is down.'
          tags:
            - tag: component
              value: control-plane
            - tag: scope
              value: availability

        - uuid: 0b777161d8ca4bb48613ab8f6e8dc35a
          name: 'Database reachable'
          type: DEPENDENT
          key: valenius.db.up
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_db_up
                - value
                - ''
          valuemap:
            name: 'Boolean'
          tags:
            - tag: component
              value: control-plane
            - tag: scope
              value: availability

        - uuid: 5e4de6b48c20461b8f3023b8211fe6fb
          name: 'Database probe query duration'
          type: DEPENDENT
          key: valenius.db.query.duration
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_db_query_duration_seconds
                - value
                - ''
          tags:
            - tag: component
              value: control-plane
            - tag: scope
              value: performance

        - uuid: 1daf1eef371f4768a20e56d754431931
          name: 'License is valid'
          type: DEPENDENT
          key: valenius.license.valid
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_license_valid
                - value
                - ''
          valuemap:
            name: 'License validity'
          tags:
            - tag: component
              value: license
            - tag: scope
              value: availability

        - uuid: 8fa92e887e7c43d686766ac54cd73a3a
          name: 'License grace period active'
          type: DEPENDENT
          key: valenius.license.grace
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_license_grace_active
                - value
                - ''
          valuemap:
            name: 'Boolean'
          tags:
            - tag: component
              value: license

        - uuid: 3ec9c5191c244ecdb90ff05a43c1940e
          name: 'License time until expiry'
          type: DEPENDENT
          key: valenius.license.expiry.left
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_license_expiry_timestamp_seconds
                - value
                - ''
            - type: JAVASCRIPT
              parameters:
                - 'return value - Date.now()/1000;'
          description: 'Only present when the license carries an expiry (Pro). Community/perpetual licenses have no such series, so this item goes unsupported by design — not an error.'
          tags:
            - tag: component
              value: license
            - tag: scope
              value: notice

        - uuid: c693bb8f7817426b97d7d584e2f9f871
          name: 'License seats total'
          type: DEPENDENT
          key: valenius.license.seats.total
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_license_seats_total
                - value
                - ''
          description: '-1 means unlimited.'
          tags:
            - tag: component
              value: license
            - tag: scope
              value: capacity

        - uuid: 1f2a497928a241ed86d60f4cc4ab7e3f
          name: 'License seats used'
          type: DEPENDENT
          key: valenius.license.seats.used
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_license_seats_used
                - value
                - ''
          tags:
            - tag: component
              value: license
            - tag: scope
              value: capacity

        - uuid: 76d0b477e6014489b4aac028b7341e34
          name: 'License seats used, percent'
          type: CALCULATED
          key: valenius.license.seats.pct
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          params: 'last(//valenius.license.seats.used)/last(//valenius.license.seats.total)*100'
          description: 'Meaningless (and not evaluated by any trigger) when seats.total is -1 (unlimited).'
          tags:
            - tag: component
              value: license
            - tag: scope
              value: capacity

        - uuid: 3381f4945c084d2d917cedbbb3069e1a
          name: 'Gateways configured'
          type: DEPENDENT
          key: valenius.gateways.total
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          master_item:
            key: valenius.get.metrics
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - valenius_gateways_total
                - value
                - ''
          tags:
            - tag: component
